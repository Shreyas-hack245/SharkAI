[project]
name = "sharkai"
version = "0.1.0"
description = "AI-assisted network forensics and CTF analysis for PCAP/PCAPNG files"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27", "reportlab>=4.0"]

[project.scripts]
sharkai = "sharkai.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using .httpx. with .starlette.testclient.*"]

[tool.setuptools.package-data]
sharkai = ["web/*"]
